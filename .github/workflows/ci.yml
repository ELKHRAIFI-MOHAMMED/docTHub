name: CI

on:
  push:
    branches: [master, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: API (PHPUnit + knowledge checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACK/sahtek
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: docthub_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, fileinfo, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      # Blocking: every test, including the knowledge:fetch / import / validate suites (HTTP is always simulated).
      - name: Tests
        run: php artisan test

      # Report only: the shipped catalog is unreviewed sample content, so this check is EXPECTED to fail
      # (emergency rules without a reviewer...). The report is written to the job summary.
      # Make it blocking (remove continue-on-error) once real reviewed content is loaded.
      - name: knowledge:validate on the sample catalog (report)
        continue-on-error: true
        env:
          DB_DATABASE: docthub_ci
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE docthub_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          php artisan migrate --seed --force --no-interaction
          php artisan knowledge:validate --format=markdown | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  frontend:
    name: Web app (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
